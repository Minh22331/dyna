name: Build WaterSurface.mgfxo

on:
  workflow_dispatch:
  push:
    paths:
      - "WaterSurface.fx"
      - "WaterSurface.Common.fxh"
      - "WaterSurface.Dense.fxh"
      - "WaterSurface.Neuronal.fxh"
      - "WaterSurface.Debug.fxh"
      - "Common.fxh"
      - "TiltShift.fxh"
      - "GodRay.fxh"
      - "CanopyLight.fxh"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install MonoGame Content Builder (mgfxc)
        run: dotnet tool install -g dotnet-mgfxc

      - name: Build WaterSurface.mgfxo (OpenGL profile)
        run: mgfxc WaterSurface.fx WaterSurface.mgfxo /Profile:OpenGL

      - name: Upload built shader
        uses: actions/upload-artifact@v4
        with:
          name: WaterSurface-mgfxo
          path: WaterSurface.mgfxo
